<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="oceanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071428" />
      <stop offset="60%" stop-color="#0F2B52" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="palmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7D52" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#oceanSky)" />
  <!-- Glowing Moon / Island Sun -->
  <circle cx="680" cy="140" r="100" fill="#FDE68A" fill-opacity="0.18" filter="blur(25px)" />
  <!-- Coastal Towers with curved superyacht architecture -->
  <path d="M 180,420 Q 220,160 290,100 L 340,100 Q 380,240 370,420 Z" fill="#132F59" />
  <path d="M 370,420 Q 420,120 490,60 L 530,60 Q 560,200 540,420 Z" fill="url(#palmGold)" opacity="0.9" />
  <path d="M 540,420 Q 580,200 630,150 L 660,150 Q 690,260 670,420 Z" fill="#112A50" />
  <!-- Floor Terraces -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2">
    <line x1="210" y1="200" x2="350" y2="200" />
    <line x1="225" y1="260" x2="360" y2="260" />
    <line x1="240" y1="320" x2="365" y2="320" />
    <line x1="400" y1="160" x2="520" y2="160" />
    <line x1="415" y1="220" x2="530" y2="220" />
    <line x1="430" y1="280" x2="535" y2="280" />
    <line x1="440" y1="340" x2="538" y2="340" />
  </g>
  <!-- Beach & Water -->
  <path d="M 0,420 Q 200,410 400,425 T 800,415 L 800,500 L 0,500 Z" fill="#0A1C38" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5A880" stroke-width="2" />
  <text x="40" y="465" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8F9FA" letter-spacing="1">PALM JUMEIRAH ISLAND</text>
  <text x="40" y="485" font-family="'Inter', sans-serif" font-size="12" fill="#C5A880" letter-spacing="2">PRIVATE BEACHFRONT RESIDENCES</text>
</svg>

