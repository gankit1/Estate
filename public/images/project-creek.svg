<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1C38" />
      <stop offset="60%" stop-color="#102C57" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D3" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7D52" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#071428" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <!-- Sun / Glow -->
  <circle cx="620" cy="180" r="140" fill="#C5A880" fill-opacity="0.12" filter="blur(30px)" />
  <!-- Architectural Silhouette Towers -->
  <rect x="120" y="160" width="90" height="260" fill="#132B4F" rx="4" />
  <rect x="230" y="90" width="130" height="330" fill="#0D2240" rx="6" />
  <!-- Iconic Spire Tower -->
  <polygon points="410,60 435,420 385,420" fill="url(#goldGrad)" opacity="0.85" />
  <rect x="390" y="40" width="40" height="380" fill="#173562" rx="4" opacity="0.7" />
  <line x1="410" y1="20" x2="410" y2="60" stroke="#C5A880" stroke-width="4" />
  <rect x="450" y="140" width="110" height="280" fill="#11294D" rx="4" />
  <rect x="580" y="190" width="100" height="230" fill="#0E2342" rx="4" />
  <!-- Glass Architectural Grid Lines -->
  <g stroke="#C5A880" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="250" y1="120" x2="340" y2="120" />
    <line x1="250" y1="160" x2="340" y2="160" />
    <line x1="250" y1="200" x2="340" y2="200" />
    <line x1="250" y1="240" x2="340" y2="240" />
    <line x1="250" y1="280" x2="340" y2="280" />
    <line x1="250" y1="320" x2="340" y2="320" />
    <line x1="250" y1="360" x2="340" y2="360" />
  </g>
  <!-- Water Reflection / Promenade -->
  <rect x="0" y="420" width="800" height="80" fill="url(#waterGrad)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5A880" stroke-opacity="0.5" stroke-width="2" />
  <text x="40" y="465" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8F9FA" letter-spacing="1">DUBAI CREEK HARBOUR</text>
  <text x="40" y="485" font-family="'Inter', sans-serif" font-size="12" fill="#C5A880" letter-spacing="2">LUXURY WATERFRONT RESIDENCES</text>
</svg>

