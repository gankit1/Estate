<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061224" />
      <stop offset="45%" stop-color="#0E2342" />
      <stop offset="80%" stop-color="#163765" />
      <stop offset="100%" stop-color="#22487F" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E2" />
      <stop offset="40%" stop-color="#E5D0B1" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#937346" />
    </linearGradient>
    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0" />
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1E38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#040C18" />
    </linearGradient>
    
    <linearGradient id="towerGlass1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143159" />
      <stop offset="50%" stop-color="#1B4277" />
      <stop offset="100%" stop-color="#0E2445" />
    </linearGradient>

    <linearGradient id="towerGlass2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3E70" />
      <stop offset="70%" stop-color="#285C9F" />
      <stop offset="100%" stop-color="#122E54" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Ambient Golden Dawn/Dusk Sun Glow -->
  <circle cx="750" cy="320" r="280" fill="#C5A880" fill-opacity="0.08" />
  <circle cx="750" cy="320" r="140" fill="#E5D0B1" fill-opacity="0.12" />

  <!-- Distant Background Silhouette Towers -->
  <g fill="#0A182F" opacity="0.6">
    <rect x="180" y="320" width="70" height="360" rx="3" />
    <polygon points="215,260 250,320 180,320" />
    <rect x="290" y="280" width="85" height="400" rx="4" />
    <rect x="420" y="240" width="95" height="440" rx="4" />
    <rect x="850" y="260" width="80" height="420" rx="3" />
    <rect x="960" y="310" width="110" height="370" rx="4" />
  </g>

  <!-- Architectural Construction Cranes (Signifying Off-Plan Developments) -->
  <g stroke="#C5A880" stroke-width="2" opacity="0.45" stroke-linecap="round">
    <!-- Crane 1 (Left Tower) -->
    <line x1="380" y1="120" x2="380" y2="280" />
    <line x1="330" y1="135" x2="480" y2="135" />
    <line x1="380" y1="105" x2="380" y2="120" />
    <line x1="380" y1="105" x2="460" y2="135" />
    <line x1="380" y1="105" x2="340" y2="135" />
    <line x1="450" y1="135" x2="450" y2="175" stroke-dasharray="3 3" />
    <!-- Crane 2 (Center Right Mega Tower) -->
    <line x1="720" y1="60" x2="720" y2="210" />
    <line x1="660" y1="80" x2="840" y2="80" />
    <line x1="720" y1="45" x2="720" y2="60" />
    <line x1="720" y1="45" x2="810" y2="80" />
    <line x1="720" y1="45" x2="680" y2="80" />
    <line x1="790" y1="80" x2="790" y2="130" stroke-dasharray="3 3" />
  </g>

  <!-- Midground Modern Off-Plan High-Rise Towers -->
  <!-- Tower A (Left Tiered Luxury Highrise) -->
  <rect x="130" y="220" width="130" height="460" fill="url(#towerGlass1)" rx="6" />
  <rect x="150" y="180" width="90" height="500" fill="url(#towerGlass2)" rx="4" />
  <polygon points="195,130 230,180 160,180" fill="url(#goldGrad)" opacity="0.8" />
  
  <!-- Architectural Floor Lines Tower A -->
  <g stroke="#C5A880" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="130" y1="260" x2="260" y2="260" />
    <line x1="130" y1="300" x2="260" y2="300" />
    <line x1="130" y1="340" x2="260" y2="340" />
    <line x1="130" y1="380" x2="260" y2="380" />
    <line x1="130" y1="420" x2="260" y2="420" />
    <line x1="130" y1="460" x2="260" y2="460" />
    <line x1="130" y1="500" x2="260" y2="500" />
    <line x1="130" y1="540" x2="260" y2="540" />
    <line x1="130" y1="580" x2="260" y2="580" />
    <line x1="130" y1="620" x2="260" y2="620" />
  </g>

  <!-- Tower B (Center Iconic Twisted Aerodynamic Supertall) -->
  <g>
    <!-- Tower Body -->
    <polygon points="560,110 650,110 670,680 540,680" fill="url(#towerGlass2)" />
    <!-- Gold Crown & Spire -->
    <polygon points="605,40 645,110 565,110" fill="url(#goldGrad)" opacity="0.95" />
    <line x1="605" y1="10" x2="605" y2="40" stroke="#FFF2E2" stroke-width="3" />
    <!-- Diagonal Dynamic Architecture Fins -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75">
      <line x1="560" y1="140" x2="655" y2="180" />
      <line x1="556" y1="220" x2="659" y2="260" />
      <line x1="552" y1="300" x2="662" y2="340" />
      <line x1="548" y1="380" x2="665" y2="420" />
      <line x1="544" y1="460" x2="668" y2="500" />
      <line x1="540" y1="540" x2="670" y2="580" />
    </g>
    <!-- Vertical Spine Glow -->
    <line x1="605" y1="40" x2="605" y2="680" stroke="#FFF2E2" stroke-opacity="0.4" stroke-width="2" />
  </g>

  <!-- Tower C (Right Curved Waterfront Branded Residence) -->
  <path d="M720,210 Q830,240 850,680 L700,680 Z" fill="url(#towerGlass1)" />
  <path d="M720,210 Q830,240 850,680" stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.9" />
  <!-- Balcony Ribs -->
  <g stroke="#C5A880" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="710" y1="260" x2="795" y2="260" />
    <line x1="708" y1="310" x2="812" y2="310" />
    <line x1="706" y1="360" x2="825" y2="360" />
    <line x1="704" y1="410" x2="834" y2="410" />
    <line x1="702" y1="460" x2="840" y2="460" />
    <line x1="700" y1="510" x2="845" y2="510" />
    <line x1="698" y1="560" x2="848" y2="560" />
    <line x1="696" y1="610" x2="850" y2="610" />
  </g>

  <!-- Foreground Waterfront Promenade & Marina Basin -->
  <rect x="0" y="660" width="1200" height="140" fill="url(#waterGrad)" />
  <!-- Waterfront Reflection Glow Lines -->
  <line x1="0" y1="660" x2="1200" y2="660" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
  
  <g stroke="#C5A880" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="160" y1="690" x2="250" y2="690" />
    <line x1="560" y1="695" x2="680" y2="695" stroke-width="2.5" stroke-opacity="0.4" />
    <line x1="590" y1="720" x2="640" y2="720" stroke-width="2" stroke-opacity="0.3" />
    <line x1="750" y1="710" x2="830" y2="710" />
    <line x1="100" y1="740" x2="1100" y2="740" stroke-dasharray="10 15" stroke-opacity="0.15" />
  </g>

  <!-- Luxury Off-Plan Typography Overlay -->
  <g>
    <rect x="60" y="690" width="460" height="75" rx="8" fill="#061325" fill-opacity="0.85" stroke="#C5A880" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="85" y="725" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="300" fill="#FFFFFF" letter-spacing="2">DUBAI OFF-PLAN PROJECTS</text>
    <text x="85" y="748" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C5A880" letter-spacing="3">TIER-1 MASTER DEVELOPMENTS • 2026–2028</text>
  </g>
</svg>

