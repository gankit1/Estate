<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="citySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040B16" />
      <stop offset="60%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#12325E" />
    </linearGradient>
    <linearGradient id="bronzeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#citySky)" />
  <!-- Golden Amber Glow -->
  <circle cx="280" cy="160" r="130" fill="#C5A880" fill-opacity="0.12" filter="blur(35px)" />
  <!-- DIFC Iconic Gate Building Silhouette -->
  <rect x="250" y="140" width="300" height="40" fill="url(#gateGrad)" rx="3" />
  <rect x="270" y="180" width="60" height="240" fill="url(#bronzeGold)" rx="2" />
  <rect x="470" y="180" width="60" height="240" fill="url(#bronzeGold)" rx="2" />
  <rect x="330" y="240" width="140" height="180" fill="#081528" fill-opacity="0.7" />
  <!-- Surrounding Financial High-Rises -->
  <rect x="70" y="100" width="140" height="320" fill="#0D2240" rx="4" />
  <rect x="570" y="80" width="160" height="340" fill="#102A50" rx="5" />
  <!-- Facade Lines -->
  <g stroke="#C5A880" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="85" y1="140" x2="195" y2="140" />
    <line x1="85" y1="180" x2="195" y2="180" />
    <line x1="85" y1="220" x2="195" y2="220" />
    <line x1="85" y1="260" x2="195" y2="260" />
    <line x1="85" y1="300" x2="195" y2="300" />
    <line x1="585" y1="120" x2="715" y2="120" />
    <line x1="585" y1="160" x2="715" y2="160" />
    <line x1="585" y1="200" x2="715" y2="200" />
    <line x1="585" y1="240" x2="715" y2="240" />
    <line x1="585" y1="280" x2="715" y2="280" />
  </g>
  <!-- Base Plaza -->
  <rect x="0" y="420" width="800" height="80" fill="#050E1A" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5A880" stroke-width="2" />
  <text x="40" y="465" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8F9FA" letter-spacing="1">DIFC &amp; BUSINESS BAY</text>
  <text x="40" y="485" font-family="'Inter', sans-serif" font-size="12" fill="#C5A880" letter-spacing="2">GLOBAL FINANCIAL HUBS &amp; ULTRA-PRIME TOWERS</text>
</svg>

