<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050D1A" />
      <stop offset="60%" stop-color="#0A1C38" />
      <stop offset="100%" stop-color="#102C57" />
    </linearGradient>
    <linearGradient id="crystalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#nightSky)" />
  <!-- City Skyline Silhouette -->
  <rect x="60" y="240" width="90" height="180" fill="#0D2447" rx="3" />
  <rect x="170" y="160" width="120" height="260" fill="#132B4F" rx="4" />
  <!-- Hyper-Tower with Diamond Crown -->
  <polygon points="390,20 410,20 430,70 410,420 370,420 390,70" fill="url(#crystalGold)" />
  <line x1="400" y1="5" x2="400" y2="20" stroke="#FDE68A" stroke-width="3" />
  <!-- Diamond faceted pattern on crown -->
  <polygon points="400,20 420,50 400,70 380,50" fill="#FFFFFF" fill-opacity="0.4" />
  <!-- Neighboring High-Rise Towers -->
  <rect x="440" y="110" width="140" height="310" fill="#0F284E" rx="4" />
  <rect x="600" y="190" width="100" height="230" fill="#0C203E" rx="3" />
  <!-- Glowing Architectural Windows -->
  <g fill="#FDE68A" fill-opacity="0.25">
    <rect x="185" y="180" width="15" height="15" />
    <rect x="210" y="180" width="15" height="15" />
    <rect x="235" y="180" width="15" height="15" />
    <rect x="260" y="180" width="15" height="15" />
    <rect x="185" y="220" width="15" height="15" />
    <rect x="210" y="220" width="15" height="15" />
    <rect x="235" y="220" width="15" height="15" />
    <rect x="260" y="220" width="15" height="15" />
    <rect x="460" y="130" width="20" height="20" />
    <rect x="495" y="130" width="20" height="20" />
    <rect x="530" y="130" width="20" height="20" />
    <rect x="460" y="170" width="20" height="20" />
    <rect x="495" y="170" width="20" height="20" />
    <rect x="530" y="170" width="20" height="20" />
  </g>
  <!-- Canal Water -->
  <rect x="0" y="420" width="800" height="80" fill="#061224" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5A880" stroke-width="2" />
  <text x="40" y="465" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8F9FA" letter-spacing="1">DOWNTOWN &amp; BUSINESS BAY</text>
  <text x="40" y="485" font-family="'Inter', sans-serif" font-size="12" fill="#C5A880" letter-spacing="2">ARCHITECTURAL HYPER-TOWERS &amp; SKY MANSIONS</text>
</svg>

