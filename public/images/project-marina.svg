<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="marinaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050D1A" />
      <stop offset="50%" stop-color="#0C254A" />
      <stop offset="100%" stop-color="#0F3870" />
    </linearGradient>
    <linearGradient id="marinaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#855B28" />
    </linearGradient>
    <linearGradient id="marinaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#040C18" />
    </linearGradient>
  </defs>
  <!-- Night Backdrop -->
  <rect width="800" height="500" fill="url(#marinaSky)" />
  <!-- Crescent Glow -->
  <circle cx="650" cy="120" r="90" fill="#C5A880" fill-opacity="0.12" filter="blur(25px)" />
  <!-- High-Rise Marina Towers Silhouette -->
  <rect x="70" y="140" width="80" height="280" fill="#0D2240" rx="4" />
  <rect x="170" y="80" width="110" height="340" fill="#132F57" rx="5" />
  <rect x="300" y="50" width="130" height="370" fill="url(#marinaGold)" opacity="0.88" rx="6" />
  <rect x="450" y="100" width="100" height="320" fill="#102C57" rx="4" />
  <rect x="570" y="170" width="90" height="250" fill="#0E2342" rx="4" />
  <rect x="680" y="210" width="70" height="210" fill="#08172D" rx="3" />
  <!-- Architectural Terraces and Spire -->
  <polygon points="365,15 375,50 355,50" fill="#FFFBEB" />
  <line x1="365" y1="5" x2="365" y2="15" stroke="#C5A880" stroke-width="3" />
  <!-- Window Lights Grid -->
  <g fill="#FDE68A" fill-opacity="0.22">
    <rect x="190" y="120" width="18" height="10" rx="1" />
    <rect x="220" y="120" width="18" height="10" rx="1" />
    <rect x="250" y="120" width="18" height="10" rx="1" />
    <rect x="190" y="160" width="18" height="10" rx="1" />
    <rect x="220" y="160" width="18" height="10" rx="1" />
    <rect x="250" y="160" width="18" height="10" rx="1" />
    <rect x="190" y="200" width="18" height="10" rx="1" />
    <rect x="220" y="200" width="18" height="10" rx="1" />
    <rect x="250" y="200" width="18" height="10" rx="1" />
    <rect x="470" y="140" width="22" height="12" rx="1" />
    <rect x="510" y="140" width="22" height="12" rx="1" />
    <rect x="470" y="180" width="22" height="12" rx="1" />
    <rect x="510" y="180" width="22" height="12" rx="1" />
  </g>
  <!-- Luxury Superyacht Silhouette in Promenade Marina -->
  <path d="M 220,405 L 340,405 L 320,380 L 250,380 Z" fill="#FFFFFF" fill-opacity="0.85" />
  <polygon points="260,380 290,355 310,380" fill="#C5A880" />
  <!-- Water Reflection / Promenade -->
  <rect x="0" y="420" width="800" height="80" fill="url(#marinaWater)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5A880" stroke-width="2" />
  <text x="40" y="465" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8F9FA" letter-spacing="1">DUBAI MARINA &amp; WATERFRONT</text>
  <text x="40" y="485" font-family="'Inter', sans-serif" font-size="12" fill="#C5A880" letter-spacing="2">PROMENADE LIVING &amp; SUPERYACHT BERTHS</text>
</svg>

